version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: activityhub-db

    restart: always

    environment:
      POSTGRES_USER: activityhub
      POSTGRES_PASSWORD: activityhub123
      POSTGRES_DB: activityhub_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  pgadmin:
    image: dpage/pgadmin4
    container_name: activityhub-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

volumes:
  postgres_data:
